name: CI Pipeline - Flask App + OpenShift

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: 📦 Install required Python tools
      run: |
        pip install flake8 black bandit pytest

    # ------------------------------
    # 🧱 BASIC TASKS
    # ------------------------------

    - name: ✅ Lint Python with flake8 (basic)
      run: flake8 app.py

    - name: ✅ Check formatting with black (basic)
      run: black --check app.py

    - name: ✅ Unit test with pytest (basic)
      run: pytest || echo "No tests found. Skipping."

    - name: 🐳 Build Docker image (basic)
      run: docker build -t flask-linuxplus-demo:latest .

    # ------------------------------
    # 🎉 FUN TASKS
    # ------------------------------

    - name: 🔐 Security scan with Bandit (fun)
      run: bandit -r .

    - name: 🧪 Run container for testing (fun)
      run: |
        docker run -d -p 5000:5000 --name test-container flask-linuxplus-demo
        sleep 5

    - name: ❤️ Health check via curl (fun)
      run: |
        curl -f http://localhost:5000/ || (echo "App failed to respond" && exit 1)

    - name: 📦 Save Docker image to tarball (fun)
      run: docker save flask-linuxplus-demo:latest -o flask-app.tar

    - name: ☁️ Upload image as artifact (fun)
      uses: actions/upload-artifact@v3.1.3
      with:
        name: flask-app-image
        path: flask-app.tar

    - name: 🧹 Cleanup container (fun)
      if: always()
      run: docker rm -f test-container || true

    # ------------------------------
    # 🚀 OpenShift Deployment (POSTPONED / OPTIONAL)
    # ------------------------------

    - name: 🔧 Install OpenShift CLI
      run: |
        curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz
        tar -xzf openshift-client-linux.tar.gz
        sudo mv oc kubectl /usr/local/bin/

    - name: 🔐 Login to OpenShift (optional)
      env:
        OPENSHIFT_SERVER: ${{ secrets.OCP_SERVER }}
        OPENSHIFT_TOKEN: ${{ secrets.OCP_TOKEN }}
      run: |
        oc login --token=$OPENSHIFT_TOKEN --server=$OPENSHIFT_SERVER

    - name: 🚢 Push image to OpenShift registry (placeholder)
      run: echo "Image push step goes here when registry access is ready"

    - name: 🔁 Rollout restart deployment (optional)
      run: |
        oc rollout restart deployment/myapp -n mynamespace
